# Продакшен (Ubuntu): без монтирования кода. Наружу смотрит только web — по HTTP,
# за вашим обратным прокси nginx, который отвечает за домен и HTTPS.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-prod-backend: &prod-backend
  restart: unless-stopped
  environment:
    APP_ENV: prod

services:
  db:
    restart: unless-stopped

  api:
    <<: *prod-backend

  bot:
    <<: *prod-backend

  worker:
    <<: *prod-backend

  web:
    image: buh-calendar-web:prod
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    ports:
      # по умолчанию доступен только с самого сервера
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
