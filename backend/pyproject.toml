[project]
name = "buh-calendar-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3,<4",
    "aiohttp-socks",
    "alembic",
    "apscheduler>=3,<4",
    "asyncpg",
    "fastapi",
    "fpdf2",
    "openpyxl",
    "httpx",
    "pyjwt",
    "pyyaml",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
