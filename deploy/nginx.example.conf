# Пример для вашего обратного прокси nginx. Замените домен, пути к сертификатам
# и адрес (HTTP_BIND:HTTP_PORT из .env проекта).
server {
    listen 80;
    server_name calendar.example.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name calendar.example.ru;

    ssl_certificate     /etc/letsencrypt/live/calendar.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calendar.example.ru/privkey.pem;

    # платёжки клиентов до 10 МБ (по умолчанию nginx принимает только 1 МБ)
    client_max_body_size 11m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # в этих адресах одноразовые ключи входа: не писать их в логи
    location /api/auth/poll/ {
        access_log off;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Заголовок X-Frame-Options не добавляйте: Telegram открывает Mini App во фрейме.
}
