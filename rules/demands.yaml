# Требования и уведомления инспекции: вид определяется по КНД.
# response_workdays — срок ответа в рабочих днях со дня подписания квитанции, если в самом
# документе не указано другое. Пусто — срок берётся только из документа или вводится вручную.
receipt:
  workdays: 6
  source: "п. 5.1 ст. 23, п. 2 ст. 6.1 НК РФ"

types:
  - knd: "1165050"
    name: "Требование о представлении пояснений"
    short: "требование о пояснениях"
    action: "Представить пояснения"
    task_kind: other
    response_workdays: 5
    source: "п. 3 ст. 88 НК РФ"

  - knd: "1165013"
    name: "Требование о представлении документов (информации)"
    short: "требование о документах"
    action: "Представить документы (информацию)"
    task_kind: other
    # 10 или 5 рабочих дней: срок читается из документа
    response_workdays: 10
    source: "ст. 93, 93.1 НК РФ"

  - knd: "1160001"
    name: "Требование об уплате задолженности"
    short: "требование об уплате"
    action: "Уплатить задолженность"
    task_kind: payment
    response_workdays: 8
    source: "ст. 69 НК РФ"

  - knd: "1165009"
    name: "Уведомление о вызове в налоговую"
    short: "вызов в налоговую"
    action: "Явиться в налоговую"
    task_kind: other
    response_label: "Дата явки"
    source: "пп. 4 п. 1 ст. 31 НК РФ"

other:
  name: "Другой документ инспекции"
  short: "требование"
  action: "Исполнить требование"
  task_kind: other
  source: "ст. 31 НК РФ"
