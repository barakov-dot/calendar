# Налоговые сроки за периоды 2027 года.
# Сроки указаны по закону; перенос с выходных (п. 7 ст. 6.1 НК РФ) делает сервис.
# Каждое правило имеет source. Открытые вопросы — rules/questions-2026.yaml.
#
# Новый год: скопируйте файл в rules/<год>.yaml, поменяйте year, сверьте с изменениями
# законодательства и прогоните тесты. Пока файла нет, задачи за этот год не создаются.
year: 2027
checked: "2026-11-27: как 2026 год плюс 425-ФЗ (имущественные налоги). Законопроекты о травматизме ещё не опубликованы"

rules:
  # --- УСН ---
  - code: usn_notice
    title: "УСН: уведомление об авансе за {period_name}"
    action: "Подать уведомление об авансе по УСН"
    kind: notice
    applies: { main_regime: [usn6, usn15] }
    schedule: { type: quarterly, quarters: [1, 2, 3], day: 25, month_offset: 1, naming: cumulative }
    needs_amount: false
    client_visible: true
    source: "п. 9 ст. 58 НК РФ"

  - code: usn_advance
    title: "УСН: авансовый платёж за {period_name}"
    action: "Уплатить авансовый платёж по УСН"
    kind: payment
    applies: { main_regime: [usn6, usn15] }
    schedule: { type: quarterly, quarters: [1, 2, 3], day: 28, month_offset: 1, naming: cumulative }
    needs_amount: true
    client_visible: true
    source: "п. 7 ст. 346.21 НК РФ"

  - code: usn_declaration_ooo
    title: "УСН: декларация за {period_name}"
    action: "Сдать декларацию по УСН"
    kind: report
    applies: { main_regime: [usn6, usn15], entity_type: [ooo] }
    schedule: { type: yearly, day: 25, month: 3 }
    needs_amount: false
    client_visible: true
    source: "пп. 1 п. 1 ст. 346.23 НК РФ"

  - code: usn_year_ooo
    title: "УСН: налог за {period_name}"
    action: "Уплатить налог по УСН"
    kind: payment
    applies: { main_regime: [usn6, usn15], entity_type: [ooo] }
    schedule: { type: yearly, day: 28, month: 3 }
    needs_amount: true
    client_visible: true
    source: "п. 7 ст. 346.21 НК РФ"

  - code: usn_declaration_ip
    title: "УСН: декларация за {period_name}"
    action: "Сдать декларацию по УСН"
    kind: report
    applies: { main_regime: [usn6, usn15], entity_type: [ip] }
    schedule: { type: yearly, day: 25, month: 4 }
