    now: "Не создаются; в Фазе 5 их можно будет завести своими задачами."
  - topic: "ЕФС-1 о стаже"
    question: "Сведения о стаже подаются только по сотрудникам из перечня п. 3 ст. 11 закона № 27-ФЗ. Нужен ли отдельный признак компании, чтобы не создавать задачу остальным?"
    now: "Создаётся всем работодателям с пометкой «только по сотрудникам из перечня»."
  - topic: "Налог на имущество ИП"
    question: "Нужны ли напоминания ИП о налоге на имущество (по уведомлению до 1 декабря)? Спрашивалось только про землю и транспорт."
    now: "У ИП есть только транспортный и земельный налог."
