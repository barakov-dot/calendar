# Открытые вопросы по срокам. "сейчас" — как сервис ведёт себя, пока ответа нет.
# Эти строки попадают в Excel.
questions:
  - topic: "Взносы на травматизм и ЕФС-1 с 2027 года"
    question: "По сообщениям профильных СМИ, законопроекты № 617-9 и № 619-9 приняты Госдумой в третьем чтении 24.11.2026: взносы переходят в ФНС, срок 28-е, отчётность в РСВ. Опубликованного закона на 27.11.2026 я не видел и тексты законопроектов не читал. Проверить после публикации и обновить rules/2027.yaml."
    now: "В 2027 году действуют прежние сроки (15-е и ЕФС-1 раздел 2) с пометкой в задаче. Они раньше предполагаемых новых."
  - topic: "Прочие изменения законопроекта № 617-9"
    question: "По сообщениям СМИ, он меняет и другие нормы (НДФЛ, УСН, НДС). Меняются ли сроки — проверить по опубликованному тексту."
    now: "rules/2027.yaml отличается от 2026 года только имущественными налогами (425-ФЗ)."
  - topic: "Порядок авансов по прибыли по умолчанию"
    question: "Ответ «по квартала по умолчанию» понят как «ежемесячные авансы по прибыли прошлого квартала». Если имелся в виду порядок «поквартально», скажите."
    now: "Новая компания на ОСНО получает ежемесячные авансы по прошлому кварталу."
  - topic: "Авансы по имущественным налогам"
    question: "Ответ «нет авансов по всем» понят как «ни у кого из клиентов авансов нет». Если наоборот, включите признак у компаний или скажите, чтобы он был включён по умолчанию."
    now: "Признак «Платит авансы по имущественным налогам» выключен по умолчанию."
  - topic: "Статистика"
