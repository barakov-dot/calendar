# Вопросы по срокам, на которые нельзя ответить только по тексту закона.
# "сейчас" — как сервис ведёт себя, пока ответа нет. Эти строки попадают в Excel.
questions:
  - topic: "Уведомление по торговому сбору"
    question: "Подаёте ли уведомление об исчисленном торговом сборе? Декларации по нему нет, и по буквальному тексту п. 9 ст. 58 НК РФ уведомление нужно, но разъяснение ФНС я не проверял."
    now: "Есть только платёж, уведомление не создаётся."
  - topic: "Уведомления по фиксированным взносам ИП, взносам 1% и патенту"
    question: "Подтверждаете, что уведомления по ним не подаются? Буквально п. 9 ст. 58 НК РФ говорит об уплате, по которой декларация не предусмотрена; практика ФНС, по моим сведениям, уведомлений не требует, но по первоисточнику это не проверено."
    now: "Уведомления не создаются."
  - topic: "Уведомление по страховым взносам за третий месяц квартала"
    question: "Верно, что за март, июнь, сентябрь и декабрь уведомление не подаётся, потому что РСВ (25-е) сдаётся раньше срока уплаты (28-е)? Это вывод из п. 9 ст. 58 НК РФ."
    now: "Уведомления только за 1-й и 2-й месяцы квартала."
  - topic: "Уведомления по налогу на прибыль"
    question: "В PLAN.md для авансов по прибыли указаны уведомления 25-го. По НК декларация подаётся раньше уплаты, поэтому уведомление по п. 9 ст. 58 не требуется, а ежемесячные авансы заявляются в декларации. Согласны? Бывают ли у вас случаи, когда уведомление всё же нужно?"
    now: "Уведомления по прибыли не создаются."
  - topic: "Порядок авансов по прибыли по умолчанию"
    question: "«Ежемесячный» порядок у ваших ООО — это ежемесячные авансы внутри квартала (по прибыли прошлого квартала) или помесячно по фактической прибыли? Какой ставить по умолчанию для новой компании?"
    now: "По умолчанию «поквартально»; порядок выбирается в карточке компании."
  - topic: "Налог на имущество"
    question: "Нужно ли разделить признак на «объекты по среднегодовой стоимости» (декларация 25.02) и «объекты по кадастровой стоимости» (уведомление за год 25.02, декларации нет)?"
    now: "Создаются и декларация, и годовое уведомление, с пояснением в задаче."
  - topic: "Отчётные периоды по имущественным налогам"
    question: "В каких регионах и муниципалитетах ваших клиентов отчётные периоды (авансы) по имуществу, транспорту и земле не установлены?"
    now: "Авансы и уведомления создаются всем; лишние можно будет отметить «Не требуется»."
  - topic: "Земельный и транспортный налог ИП"
    question: "ИП платят их по налоговому уведомлению до 1 декабря (п. 1 ст. 363 и 397 НК РФ). Нужны ли такие напоминания?"
    now: "Имущественные налоги есть только у ООО (как в PLAN.md)."
  - topic: "Патент ровно на 6 месяцев"
    question: "Пункт 2 ст. 346.51 НК РФ: «до шести месяцев» — одним платежом, «от шести месяцев» — 1/3 и 2/3. Как считать патент ровно на 6 месяцев? (В PLAN.md — одним платежом.)"
    now: "Показан более ранний порядок (1/3 в течение 90 дней и 2/3) с пометкой в задаче."
  - topic: "Взносы на травматизм и ЕФС-1 с 2027 года"
    question: "По сообщениям в профильных СМИ (первоисточником не подтверждено), готовится закон о передаче взносов на травматизм в ФНС с 2027 года: срок 28-е, отчётность в РСВ. Принят ли он? От этого зависит rules/2027.yaml."
    now: "Декабрь 2026: взносы 15.01.2027 и ЕФС-1 25.01.2027 по действующей редакции 125-ФЗ."
  - topic: "Правила на 2027 год"
    question: "Когда сверяем изменения 2027 года? Пока нет rules/2027.yaml, задачи за периоды 2027 года не создаются (в январе 2027 это уже понадобится)."
    now: "Есть задачи за периоды до декабря 2026 включительно, в том числе со сроками в 2027 году."
  - topic: "Перенос срока ЕФС-1"
    question: "В ст. 24 125-ФЗ я не нашёл нормы о переносе срока с выходного. Переносим на следующий рабочий день, как налоговые сроки?"
    now: "Переносится."
  - topic: "АУСН: взнос на травматизм без сотрудников"
    question: "Взнос платят «страхователи» (п. 4.1 ст. 22 125-ФЗ). Верно, что организации и ИП на АУСН без сотрудников его не платят? (В PLAN.md он указан без этого условия.)"
    now: "Создаётся только при признаке «Есть сотрудники»."
  - topic: "АУСН: НДФЛ"
    question: "Сроки перечисления НДФЛ на АУСН взяты общие (п. 6 ст. 226 НК РФ); уведомления и 6-НДФЛ не нужны (ч. 11 ст. 17 17-ФЗ). НДФЛ перечисляет уполномоченный банк или сам клиент — нужны ли эти задачи?"
    now: "Создаются платежи НДФЛ, без уведомлений и отчётов."
  - topic: "Отчёты, которых нет в PLAN.md"
    question: "Добавить ли годовую бухгалтерскую отчётность (31 марта), ЕФС-1 о стаже за год (25 января), прочие подразделы ЕФС-1, статистику? Основания по ним я не проверял."
    now: "Не создаются."
  - topic: "Уведомление о переходе, заявления и разовые сроки"
    question: "Нужны ли сроки подачи уведомлений о смене режима, об освобождении от НДС, о порядке уплаты прибыли и т. п.?"
    now: "Не создаются; можно будет добавить своими задачами (Фаза 5)."
  - topic: "Региональные нерабочие дни"
    question: "Есть ли клиенты в регионах с собственными праздниками (они тоже переносят сроки)? Если да, нужен календарь по регионам."
    now: "Используется только федеральный календарь."
  - topic: "Отсрочки"
    question: "Есть ли клиенты с отсрочками по постановлениям Правительства (например, N 1074 и N 1277 2026 года для пострадавших от атак на объекты маркетплейсов, ст. 346.21 НК РФ)?"
    now: "Отсрочки не учитываются; срок задачи пересчёт вернёт к общему."
  - topic: "Клиент и уведомления в ФНС"
    question: "CLAUDE.md говорит, что клиент видит платежи и отчёты, PLAN.md добавляет уведомления в ФНС. Показывать клиенту уведомления?"
    now: "Показываются (client_visible = true), как в PLAN.md."
  - topic: "Помощник бухгалтера"
    question: "Что видит помощник: компании одного бухгалтера или назначенные ему по отдельности? Кто его приглашает? Видит ли суммы и внутренние комментарии?"
    now: "Роли ещё нет, добавлена в PLAN.md отдельным пунктом."
