# Контейнер web: статика фронтенда и проксирование /api. Только HTTP —
# домен и HTTPS обслуживает внешний обратный прокси.
server {
    listen 80;
    server_name _;
    server_tokens off;
    # платёжки до 10 МБ
    client_max_body_size 11m;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS Docker: после пересоздания api адрес обновляется без перезапуска web
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # в адресах есть одноразовые ключи входа; запросы и так пишет api
        access_log off;
    }

    # файлы сборки содержат хэш в имени; отсутствующий файл — 404, а не index.html
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /theme-init.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
