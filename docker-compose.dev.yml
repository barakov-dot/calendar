# Разработка на Mac: код монтируется в контейнеры, автоперезагрузка, порты только на localhost.

# Код монтируем по частям, чтобы вложенные тома config/data/rules не создавали пустые папки в backend/
x-dev-backend: &dev-backend
  image: buh-calendar-backend:dev
  environment:
    APP_ENV: dev
  volumes:
    - ./backend/app:/app/app
    - ./backend/alembic:/app/alembic
    - ./backend/tests:/app/tests
    - ./backend/scripts:/app/scripts
    - ./backend/alembic.ini:/app/alembic.ini
    - ./backend/pyproject.toml:/app/pyproject.toml
    - ./config:/app/config
    - ./data:/app/data
    - ./rules:/app/rules:ro

services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  api:
    <<: *dev-backend
    build:
      target: dev
    ports:
      - "127.0.0.1:8000:8000"

  bot:
    <<: *dev-backend
    command: ["watchfiles", "--filter", "python", "python -m app.bot", "/app/app"]

  worker:
    <<: *dev-backend
    command: ["watchfiles", "--filter", "python", "python -m app.worker", "/app/app"]

  frontend:
    image: buh-calendar-frontend:dev
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      # зависимости собраны под Linux и с Mac не монтируются
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  frontend_node_modules:
