# Общая часть. Запуск: make dev (Mac) или make prod (сервер).
name: buh-calendar

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend: &backend
  image: buh-calendar-backend:prod
  env_file: .env
  volumes:
    - ./config:/app/config
    - ./data:/app/data
    - ./rules:/app/rules:ro
  logging: *logging

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?задайте в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте в .env}
      POSTGRES_DB: ${POSTGRES_DB:?задайте в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: во время первичной инициализации сервер слушает только сокет
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *logging

  api:
    <<: *backend
    build:
      context: ./backend
      target: prod
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  bot:
    <<: *backend
    command: ["python", "-m", "app.bot"]
    # образ собирает сервис api
    pull_policy: never
    depends_on:
      api:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    pull_policy: never
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
